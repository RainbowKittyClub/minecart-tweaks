plugins {
    id 'base'
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

java.sourceCompatibility = JavaVersion.VERSION_25
java.targetCompatibility = JavaVersion.VERSION_25

base {
    archivesName.set(project.mod_id)
}

version = project.mod_version
group = project.maven_group

repositories {
    maven {
        name = 'Nucleoid'
        url = 'https://maven.nucleoid.xyz'
    }
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    implementation "eu.pb4:polymer-bundled:${project.polymer_version}"
}

loom {
    accessWidenerPath = file("src/main/resources/${project.mod_id}.classtweaker")

    runs {
        server {
            server()
            runDir 'run'
        }

        // The dev client must not share 'run' with the server: Polymer regenerates
        // run/polymer/resource_pack.zip on whichever side starts last, and the client builds it
        // empty, so the server ends up serving a pack whose hash no longer matches the one it
        // advertised and every join fails with FAILED_DOWNLOAD.
        client {
            client()
            runDir 'run-client'
        }
    }
}

processResources {
    // Collect only simple, serializable project properties (e.g. values from gradle.properties)
    // to avoid fingerprinting errors from complex Gradle objects.
    def resourceProps = [:]
    project.properties.each { k, v ->
        if (v instanceof CharSequence || v instanceof Number || v instanceof Boolean) {
            resourceProps[k.toString()] = v.toString()
        }
    }

    resourceProps.version = project.version.toString()
    resourceProps.group = project.group.toString()
    resourceProps.name = project.name.toString()

    inputs.properties(resourceProps)

    // Provide both flat props and a nested 'project' map for ${project.*} references
    def expandMap = resourceProps + [project: resourceProps]

    filesMatching("fabric.mod.json") {
        expand(expandMap)
    }
}

// Loom reads the un-expanded template at configure time, so validate the generated file instead.
tasks.register('validateFabricModJson') {
    group = 'verification'
    description = 'Validate that the generated build/resources/main/fabric.mod.json is valid JSON.'

    doLast {
        def jsonFile = file("${buildDir}/resources/main/fabric.mod.json")
        if (!jsonFile.exists()) {
            throw new GradleException("fabric.mod.json not found at: ${jsonFile}. Ensure resources are processed.")
        }
        try {
            new groovy.json.JsonSlurper().parse(jsonFile)
            logger.lifecycle("fabric.mod.json is valid JSON: ${jsonFile}")
        } catch (Exception e) {
            throw new GradleException("fabric.mod.json is not valid JSON: ${e.message}", e)
        }
    }
}

tasks.named('processResources') {
    finalizedBy tasks.named('validateFabricModJson')
}

// MIT asks for the notice in every copy, and a jar handed to someone is a copy. Declaring the
// licence in fabric.mod.json is not that: it names the terms without carrying them.
tasks.named('jar') {
    from(file('LICENSE'))
}

tasks.register('stopServer') {
    group = 'fabric'
    description = 'Stops the dev server started by runServer, if one is running.'

    // Loom writes one launch config per project, so its path identifies this checkout's dev server
    // and nothing else. Matching on the main class or on 'runServer' would also match a sibling
    // mod's server in the same workspace, and matching on the port would miss a reconfigured one.
    def marker = file('.gradle/loom-cache/launch.cfg').absolutePath

    doLast {
        def running = []
        ProcessHandle.allProcesses().forEach { handle ->
            if (handle.info().commandLine().orElse('').contains(marker)) {
                running << handle
            }
        }
        if (running.isEmpty()) {
            logger.lifecycle('No dev server running.')
            return
        }
        // Asked to stop rather than killed: the server traps the signal and saves the world on its
        // way out, which a dev world that has been built in still deserves.
        running.each { it.destroy() }
        running.each { handle ->
            try {
                handle.onExit().get(30, java.util.concurrent.TimeUnit.SECONDS)
                logger.lifecycle("Stopped dev server (pid ${handle.pid()}).")
            } catch (java.util.concurrent.TimeoutException ignored) {
                throw new GradleException(
                        "Dev server (pid ${handle.pid()}) ignored the stop request for 30s.")
            }
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 25
}

java {
    withSourcesJar()
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }

    repositories {
        // uncomment to publish to the local maven
        // mavenLocal()
    }
}
